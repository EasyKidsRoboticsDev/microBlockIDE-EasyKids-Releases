name: Desktop releases
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      needed: ${{ steps.plan.outputs.needed }}
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Require read access to the private source repository
        env:
          SOURCE_READ_KEY: ${{ secrets.SOURCE_READ_KEY }}
        run: |
          if [ -z "$SOURCE_READ_KEY" ]; then
            echo "::error::Add SOURCE_READ_KEY with a read-only SSH deploy key for the private source repository. See DESKTOP-RELEASES.md."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: EasyKidsRoboticsDev/microBlockIDE-EasyKids-Edition-Online
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: main
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: plan
        uses: actions/github-script@v7
        env:
          MACOS_RELEASE_ENABLED: ${{ vars.MACOS_RELEASE_ENABLED }}
        with:
          script: |
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const metadata = JSON.parse(fs.readFileSync('version.json', 'utf8'));
            if (!/^\d+\.\d+\.\d+$/.test(pkg.version) || pkg.version !== metadata.version) {
              throw new Error('package.json and version.json must contain the same stable version');
            }
            const tag = `v${pkg.version}`;
            let assets = [];
            try {
              const {data} = await github.rest.repos.getReleaseByTag({...context.repo, tag});
              assets = data.assets.map(a => a.name);
            } catch (error) { if (error.status !== 404) throw error; }
            const include = [];
            if (!assets.includes('latest.yml')) include.push({os: 'windows-2022', platform: 'win'});
            if (process.env.MACOS_RELEASE_ENABLED === 'true' && !assets.includes('latest-mac.yml')) {
              include.push({os: 'macos-15-intel', platform: 'mac'});
            }
            if (process.env.MACOS_RELEASE_ENABLED !== 'true') {
              for (const [arch, os] of [['x64', 'macos-15-intel'], ['arm64', 'macos-15']]) {
                if (!assets.includes(`microBlock-IDE-EasyKids-${pkg.version}-${arch}-mac.dmg`)) {
                  include.push({os, platform: 'mac-unsigned', arch});
                }
              }
            }
            core.setOutput('matrix', JSON.stringify({include}));
            core.setOutput('needed', include.length > 0 ? 'true' : 'false');
            core.setOutput('version', pkg.version);
  build:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: EasyKidsRoboticsDev/microBlockIDE-EasyKids-Edition-Online
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select Python for native module compilation
        run: python -c "import os,sys; print('PYTHON='+sys.executable, file=open(os.environ['GITHUB_ENV'], 'a'))"
      # Native serialport is rebuilt for Electron by electron-builder, not host Node.
      - run: npm ci --ignore-scripts
      - run: npm run test:updates
      - name: Build Windows NSIS update
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          # Empty optional secrets must be absent: builder treats an empty link as a path.
          foreach ($name in @('CSC_LINK', 'CSC_KEY_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              Remove-Item "Env:$name" -ErrorAction SilentlyContinue
            }
          }
          npm run dist:win -- --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Build signed and notarized macOS updates (Intel and Apple Silicon)
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret: $name"; exit 1; fi
          done
          npm run dist:mac -- --x64 --arm64 --publish never --config.forceCodeSigning=true --config.mac.notarize.teamId="$APPLE_TEAM_ID"
      - name: Build unsigned macOS DMG for manual installation
        if: matrix.platform == 'mac-unsigned'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          npm run dist:mac -- --mac dmg --"$TARGET_ARCH" --publish never --config.mac.identity=null --config.mac.notarize=false --config.mac.hardenedRuntime=false --config.extraMetadata.desktopUpdateMode=manual
          # Unsigned DMGs are manual downloads, never an automatic update feed.
          rm -f dist/latest-mac*.yml
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch || 'all' }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Publish binaries first and update manifests last
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            printf 'Source: https://github.com/EasyKidsRoboticsDev/microBlockIDE-EasyKids-Edition-Online/commit/%s\n\nWindows: install Setup.exe; updates download automatically. macOS: install the matching Intel or Apple Silicon DMG into Applications. Unsigned macOS builds require manual updates; automatic macOS updates require Apple signing.\n' "$SOURCE_SHA" > notes.txt
            gh release create "$tag" --draft --title "microBlock IDE EasyKids $VERSION" --notes-file notes.txt
          fi
          shopt -s nullglob
          binaries=(release/*.exe release/*.dmg release/*.zip release/*.blockmap)
          manifests=(release/latest*.yml)
          [ ${#binaries[@]} -gt 0 ]
          gh release upload "$tag" "${binaries[@]}" --clobber
          if [ ${#manifests[@]} -gt 0 ]; then gh release upload "$tag" "${manifests[@]}" --clobber; fi
          printf 'Windows: install Setup.exe; updates download automatically. macOS: install the matching Intel or Apple Silicon DMG into Applications. Unsigned macOS builds require manual updates; automatic macOS updates require Apple signing.\n' > notes.txt
          gh release edit "$tag" --draft=false --latest --notes-file notes.txt
