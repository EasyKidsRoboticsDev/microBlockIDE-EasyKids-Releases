name: Desktop releases
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      needed: ${{ steps.plan.outputs.needed }}
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: EasyKidsRoboticsDev/microBlockIDE-EasyKids-Edition-Online
          ref: main
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: plan
        uses: actions/github-script@v7
        env:
          MACOS_RELEASE_ENABLED: ${{ vars.MACOS_RELEASE_ENABLED }}
        with:
          script: |
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const metadata = JSON.parse(fs.readFileSync('version.json', 'utf8'));
            if (!/^\d+\.\d+\.\d+$/.test(pkg.version) || pkg.version !== metadata.version) {
              throw new Error('package.json and version.json must contain the same stable version');
            }
            const tag = `v${pkg.version}`;
            let assets = [];
            try {
              const {data} = await github.rest.repos.getReleaseByTag({...context.repo, tag});
              assets = data.assets.map(a => a.name);
            } catch (error) { if (error.status !== 404) throw error; }
            const include = [];
            if (!assets.includes('latest.yml')) include.push({os: 'windows-latest', platform: 'win'});
            if (process.env.MACOS_RELEASE_ENABLED === 'true' && !assets.includes('latest-mac.yml')) {
              include.push({os: 'macos-15-intel', platform: 'mac'});
            }
            if (process.env.MACOS_RELEASE_ENABLED !== 'true') {
              core.warning('macOS releases disabled: configure Apple signing secrets and MACOS_RELEASE_ENABLED=true');
            }
            core.setOutput('matrix', JSON.stringify({include}));
            core.setOutput('needed', include.length > 0 ? 'true' : 'false');
            core.setOutput('version', pkg.version);
  build:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: EasyKidsRoboticsDev/microBlockIDE-EasyKids-Edition-Online
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Native serialport is rebuilt for Electron by electron-builder, not host Node.
      - run: npm ci --ignore-scripts
      - run: npm run test:updates
      - name: Build Windows NSIS update
        if: matrix.platform == 'win'
        run: npm run dist:win -- --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Build signed and notarized macOS updates (Intel and Apple Silicon)
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret: $name"; exit 1; fi
          done
          npm run dist:mac -- --x64 --arm64 --publish never --config.forceCodeSigning=true --config.mac.notarize.teamId="$APPLE_TEAM_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Publish binaries first and update manifests last
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            printf 'Source: https://github.com/EasyKidsRoboticsDev/microBlockIDE-EasyKids-Edition-Online/commit/%s\n\nWindows: install Setup.exe. macOS: install the DMG into Applications. Updates download automatically; confirm before restarting.\n' "$SOURCE_SHA" > notes.txt
            gh release create "$tag" --draft --title "microBlock IDE EasyKids $VERSION" --notes-file notes.txt
          fi
          shopt -s nullglob
          binaries=(release/*.exe release/*.dmg release/*.zip release/*.blockmap)
          manifests=(release/latest*.yml)
          [ ${#binaries[@]} -gt 0 ] && [ ${#manifests[@]} -gt 0 ]
          gh release upload "$tag" "${binaries[@]}" --clobber
          gh release upload "$tag" "${manifests[@]}" --clobber
          gh release edit "$tag" --draft=false --latest
